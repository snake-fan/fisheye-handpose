[project]
name = "fisheye-handpose-mmpose-h20"
version = "0.1.0"
description = "Pinned legacy MMPose reproduction environment for NVIDIA H20"
requires-python = "==3.10.*"
dependencies = [
  "mmcv @ https://download.openmmlab.com/mmcv/dist/cu121/torch2.1.0/mmcv-2.1.0-cp310-cp310-manylinux1_x86_64.whl",
  "mmengine==0.10.3",
  "mmdet==3.2.0",
  "mmpose==1.3.2",
  "numpy==1.26.4",
  "chumpy==0.71",
  "smplx==0.1.28",
  "torch==2.1.0",
  "torchvision==0.16.0",
]

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu121" }
torchvision = { index = "pytorch-cu121" }
chumpy = { git = "https://github.com/nim65s/chumpy.git", rev = "2816a138d2f60bc8a77eddb9962c4c825179cb56" }

[tool.uv]
required-version = ">=0.12.3,<0.13"
exclude-newer = "2024-08-01T00:00:00Z"
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
required-environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
