name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core:
    name: Core / Python 3.11
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9
        with:
          version: "0.7.9"
          enable-cache: true
      - run: uv python install 3.11
      - run: make check-core

  backend:
    name: Trace API / Python 3.11
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9
        with:
          version: "0.7.9"
          enable-cache: true
      - run: uv python install 3.11
      - run: make check-backend

  frontend:
    name: Inspector / Node 22
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: make check-frontend

  h20-static:
    name: H20 contracts / no CUDA environment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9
        with:
          version: "0.7.9"
          enable-cache: true
      - run: uv python install 3.11
      - run: make check-h20-static
