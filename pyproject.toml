[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fisheye-handpose"
version = "0.1.0"
description = "Calibration-first stereo fisheye hand-pose reconstruction"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "av>=12,<17",
  "numpy>=1.26,<3",
  "opencv-python-headless>=4.10,<5",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.9,<1",
]

[project.scripts]
fisheye-handpose = "fisheye_handpose.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "realdata: requires an external real capture session",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
